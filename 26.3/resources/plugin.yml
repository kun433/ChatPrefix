name: ChatPrefix
main: com.chatprefix.ChatPrefix
version: 1.5.1-26.3
api-version: '26.3'
description: 在聊天栏给玩家名字前加上 op 分配的前缀，并标注玩家所在维度（主世界/下界/末地）。支持称号池、Tab/头顶前缀与 CraftEngine 图片前缀。
author: ChatPrefix
softdepend: [CraftEngine]
commands:
  chatprefix:
    description: 管理玩家聊天前缀与称号。
    usage: /chatprefix help
    aliases: [cp]
permissions:
  chatprefix.admin:
    description: 允许管理玩家的聊天前缀与称号（set/rainbow/remove/get/list/title/preview/pack/ce/reload）。
    default: op
  chatprefix.use:
    description: 允许玩家查看并切换自己被授权的称号（titles/use）。
    default: true
